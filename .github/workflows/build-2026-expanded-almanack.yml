name: Build 2026 Expanded Almanack

on:
  workflow_dispatch:
  push:
    paths:
      - ISO2026.md
      - almanack.md
      - expanded-bayer-visibility-2026.csv
      - weekly-ephemeris-2026.csv
      - build_expanded_almanack.py

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4
      - name: Build expanded Almanack
        run: python build_expanded_almanack.py
      - name: Verify 53 weeks
        run: |
          test -f almanack-expanded.md
          python - <<'PY'
          import re
          from pathlib import Path
          text = Path("almanack-expanded.md").read_text(encoding="utf-8")
          weeks = re.findall(r"(?m)^## (ISO 2026-W\d{2})\s*$", text)
          expected = [f"ISO 2026-W{i:02d}" for i in range(1, 54)]
          assert weeks == expected, f"Expected W01-W53, found {len(weeks)} sections"
          print("Verified ISO 2026 W01-W53")
          PY
      - name: Commit expanded Almanack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack-expanded.md
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Build expanded 2026 Almanack"
          git push
