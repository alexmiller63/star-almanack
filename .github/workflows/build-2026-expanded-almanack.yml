name: Build 2026 Expanded Almanack

on:
  workflow_dispatch:
  push:
    paths:
      - ISO2026.md
      - almanack.md
      - expanded-bayer-visibility-2026.csv
      - expanded-bayer-stars.csv
      - bayer-supplement.csv
      - bright-star-visibility-2026.csv
      - bright-stars-2mag.csv
      - bright-variable-reconciliation.csv
      - messier-visibility-2026.csv
      - weekly-ephemeris-2026.csv
      - build_bayer_catalog.py
      - compute_bayer_visibility_2026.py
      - compute_bright_star_visibility_2026.py
      - build_expanded_almanack.py
      - enrich_stellar_entries.py
      - publish_weekly_pages.py
      - .github/workflows/build-2026-expanded-almanack.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Build expanded Almanack
        run: python build_expanded_almanack.py

      - name: Enrich stellar entries
        run: python enrich_stellar_entries.py

      - name: Verify expanded Almanack structure and stellar metadata
        run: |
          test -f almanack-expanded.md
          python - <<'PY'
          import csv
          import re
          from datetime import date, datetime
          from pathlib import Path

          text = Path('almanack-expanded.md').read_text(encoding='utf-8')
          calendar_text = text.split('\n## Expanded α and β Star Catalog\n', 1)[0]
          weeks = re.findall(r'(?m)^## (ISO 2026-W\d{2})\s*$', text)
          expected = [f'ISO 2026-W{i:02d}' for i in range(1, 54)]
          assert weeks == expected, f'Expected W01-W53, found {len(weeks)} sections'

          rows = re.findall(r'(?m)^\| (?:Mon|Tue|Wed|Thu|Fri|Sat|Sun), [A-Z][a-z]{2} \d{2}, (?:2025|2026|2027) \|', text)
          assert len(rows) == 53 * 7, f'Expected 371 day rows, found {len(rows)}'
          split_table_rows = re.findall(r'(?m)^\|[^\n]*\|\n\n(?=\|)', calendar_text)
          assert not split_table_rows, (
              f'Found {len(split_table_rows)} blank lines splitting Markdown table rows; '
              'Jekyll would render them as separate tables'
          )

          calendar_events = {}
          row_re = re.compile(
              r'(?m)^\| (?:Mon|Tue|Wed|Thu|Fri|Sat|Sun), ([A-Z][a-z]{2}) (\d{2}), (2025|2026|2027) \| [^|]+ \| ([^|]*) \|$'
          )
          for m in row_re.finditer(calendar_text):
              d = datetime.strptime(f'{m.group(1)} {m.group(2)} {m.group(3)}', '%b %d %Y').date().isoformat()
              calendar_events[d] = m.group(4).strip()

          with open('messier-visibility-2026.csv', newline='', encoding='utf-8') as f:
              messier = list(csv.DictReader(f))
          assert len(messier) == 110, f'Expected 110 Messier objects, found {len(messier)}'
          for r in messier:
              name = r['messier']
              events = calendar_events.get(r['best_date'], '')
              token = re.compile(rf'(?<![A-Za-z0-9]){re.escape(name)}(?!\d)', re.IGNORECASE)
              assert token.search(events), f'No Messier calendar representation found for {name} on {r["best_date"]}'
              occurrences = sum(len(token.findall(cell)) for cell in calendar_events.values())
              assert occurrences == 1, f'Expected exactly one Messier calendar occurrence for {name}, found {occurrences}'

          with open('bright-star-visibility-2026.csv', newline='', encoding='utf-8') as f:
              bright = list(csv.DictReader(f))
          with open('bright-variable-reconciliation.csv', newline='', encoding='utf-8') as f:
              variable_designations = {(r.get('name') or '').strip().casefold() for r in csv.DictReader(f) if (r.get('name') or '').strip()}
          new = [r for r in bright if r['new_non_alpha_beta'] == 'yes']
          assert len(bright) == 92, f'Expected 92 bright-star systems, found {len(bright)}'
          assert len(new) == 41, f'Expected 41 new non-alpha/beta systems, found {len(new)}'
          for r in new:
              d = date.fromisoformat(r['best_date'])
              assert d.isocalendar().year == 2026, (r.get('proper'), r['best_date'])
              proper = (r.get('proper') or '').strip()
              if proper:
                  events = calendar_events.get(r['best_date'], '')
                  assert proper in events, f'No calendar representation found for {proper} on {r["best_date"]}'
                  designation_key = f"{(r.get('bayer') or '').strip()} {(r.get('con') or '').strip()}".strip().casefold()
                  variable = designation_key in variable_designations
                  if variable:
                      mag = (r.get('representative_vmax') or '').strip()
                      assert mag, f'Variable star {proper} has no source magnitude'
                      expected_mag = f"V {mag}"
                      assert expected_mag in events, f'Expected {expected_mag} for variable {proper} on {r["best_date"]}; events={events}'
                  else:
                      assert not re.search(r'\bV\s+[+-]?\d', events), (
                          f'Non-variable star incorrectly marked with V magnitude for {proper}; events={events}'
                      )

          enif = calendar_events.get('2026-10-05', '')
          assert 'Enif (ε Peg) — V 2.38 — Tropical Autumn' in enif, enif
          assert 'V 2 —' not in enif, enif
          assert 'V2.38' not in enif, enif
          assert ' — variable — ' not in enif, enif

          assert 'Beta Reticuli' in text or 'β Ret' in text, 'β Reticuli missing from expanded Almanack'
          assert '2027-01-01' in Path('expanded-bayer-visibility-2026.csv').read_text(encoding='utf-8'), 'Expected a Bayer visibility date on 2027-01-01'
          print('Verified 53 weeks, 371 day rows, 110 Messier objects, variable-only stellar magnitudes, and Enif enrichment')
          PY

      - name: Generate 53 weekly HTML pages
        run: python publish_weekly_pages.py

      - name: Verify published weekly pages
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('site/2026')
          pages = sorted(root.glob('W??/index.html'))
          assert len(pages) == 53, f'Expected 53 weekly pages, found {len(pages)}'
          expected = [f'W{i:02d}' for i in range(1, 54)]
          actual = [p.parent.name for p in pages]
          assert actual == expected, (actual[:3], actual[-3:])
          assert (root / 'index.html').exists(), 'Missing 2026 index page'

          for i, page in enumerate(pages, 1):
              text = page.read_text(encoding='utf-8')
              assert f'ISO 2026-W{i:02d}' in text, page
              assert '<table class="calendar">' in text, f'Weekly calendar table missing in {page}'
              assert 'All weeks' in text, f'Index navigation missing in {page}'
              assert 'Best visibility:' not in text, f'Obsolete Best visibility label in {page}'

          w41 = (root / 'W41' / 'index.html').read_text(encoding='utf-8')
          assert 'Enif (ε Peg) — V 2.38 — Tropical Autumn' in w41, 'Enif metadata missing from published W41'
          assert 'V 2 —' not in w41, 'Rounded Enif magnitude survived publication'
          assert 'V2.38' not in w41, 'Old Enif magnitude survived publication'
          assert ' — variable — ' not in w41, 'Old variable word survived publication'
          print('Verified 53 weekly pages and enriched Enif publication')
          PY

      - name: Commit expanded Almanack and weekly pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add almanack-expanded.md site/2026
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Build and publish expanded 2026 Almanack"
          git push
