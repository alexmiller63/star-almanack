name: Diagnose DE441 Eclipse Timescale

on:

  workflow_dispatch:

jobs:

  diagnose-eclipse-timescale:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Install Python dependencies

        run: |

          python3 -m pip install --disable-pip-version-check spiceypy pyyaml

      - name: Initialize debug file

        if: always()

        run: |

          {

            echo "DE441 ECLIPSE TIMESCALE DIAGNOSTIC"

            echo "============================================================"

            echo "workflow started: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            echo

          } > debug.txt

      - name: Download NAIF leap-seconds kernel

        run: |

          echo "===== Download NAIF leap-seconds kernel =====" >> debug.txt

          curl -fL "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls" -o naif0012.tls >> debug.txt 2>&1

          echo "curl exit status: $?" >> debug.txt

          ls -l naif0012.tls >> debug.txt 2>&1

          echo >> debug.txt

      - name: Run narrow eclipse timescale diagnostic

        run: |

          {

            echo "===== Narrow eclipse timescale diagnostic ====="

            python3 - <<'PY'

          import spiceypy as spice

          from datetime import datetime, timezone

          spice.furnsh("naif0012.tls")

          dates = [

              "1970-01-01T00:00:00",

              "1971-01-01T00:00:00",

              "1972-01-01T00:00:00",

              "1973-01-01T00:00:00",

              "1974-01-01T00:00:00",

          ]

          print()

          print("UTC -> ET/TDB comparison")

          print("=" * 60)

          for utc in dates:

              et = spice.str2et(utc + " UTC")

              unix = datetime.fromisoformat(utc).replace(

                  tzinfo=timezone.utc

              ).timestamp()

              jd_utc = unix / 86400.0 + 2440587.5

              jd_et = 2451545.0 + et / 86400.0

              delta_seconds = (jd_et - jd_utc) * 86400.0

              print(f"UTC: {utc}Z")

              print(f"  ET seconds from J2000 : {et:.6f}")

              print(f"  JD UTC                : {jd_utc:.9f}")

              print(f"  JD ET/TDB             : {jd_et:.9f}")

              print(f"  ET/TDB - UTC          : {delta_seconds:.6f} s")

              print()

          spice.kclear()

          PY

          } >> debug.txt 2>&1

      - name: Show debug file

        if: always()

        run: |

          echo "===== debug.txt ====="

          cat debug.txt

      - name: Upload debug.txt

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: eclipse-timescale-debug

          path: debug.txt