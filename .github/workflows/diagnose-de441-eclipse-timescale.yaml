name: Diagnose DE441 Eclipse Timescale

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose-eclipse-timescale:
    runs-on: ubuntu-latest

    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v6

      - name: Install Python dependencies
        run: |
          python3 -m pip install --disable-pip-version-check spiceypy pyyaml

      - name: Download NAIF leap-seconds kernel
        run: |
          wget -q \
            "https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls" \
            -O naif0012.tls
          test -s naif0012.tls
          ls -lh naif0012.tls

      - name: Run narrow eclipse timescale diagnostic
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY' | tee de441-eclipse-timescale.txt
          from __future__ import annotations

          from datetime import datetime, timezone

          import spiceypy as spice
          import yaml

          import eclipse_engine


          LSK = "naif0012.tls"
          DAY_S = 86400.0


          def iso_to_datetime(text: str) -> datetime:
              return datetime.fromisoformat(text.replace("Z", "+00:00"))


          def iso_to_jd(text: str) -> float:
              dt = iso_to_datetime(text).astimezone(timezone.utc)
              hour = (
                  dt.hour
                  + dt.minute / 60.0
                  + dt.second / 3600.0
                  + dt.microsecond / 3_600_000_000.0
              )
              return eclipse_engine.gregorian_to_jd(
                  dt.year,
                  dt.month,
                  dt.day,
                  hour,
              )


          def decimal_year(text: str) -> float:
              dt = iso_to_datetime(text).astimezone(timezone.utc)
              start = datetime(dt.year, 1, 1, tzinfo=timezone.utc)
              end = datetime(dt.year + 1, 1, 1, tzinfo=timezone.utc)
              return dt.year + (dt - start).total_seconds() / (
                  end - start
              ).total_seconds()


          spice.furnsh(LSK)

          with open(
              "eclipse-validation-cases.yaml",
              "r",
              encoding="utf-8",
          ) as handle:
              spec = yaml.safe_load(handle)

          cases = []

          for case in spec["historical"]:
              cases.append(
                  {
                      "group": "historical",
                      "label": case["label"],
                      "reference": case["expected_greatest_utc"],
                  }
              )

          for case in spec["future_jello"]["cases"]:
              cases.append(
                  {
                      "group": "future",
                      "label": case["label"],
                      "reference": case["nasa_greatest_utc"],
                  }
              )

          print("=" * 92)
          print("STAR ALMANACK — NARROW ECLIPSE TIMESCALE DIAGNOSTIC")
          print("=" * 92)
          print()
          print("Purpose:")
          print("  Isolate the engine UTC -> TT/TDB approximation from eclipse geometry.")
          print("  Compare eclipse_engine.utc_to_tdb_approx() directly with NAIF SPICE")
          print("  UTC -> TDB conversion at each frozen validation reference instant.")
          print()
          print("This diagnostic does NOT change the eclipse engine and does NOT run")
          print("Sun/Moon geometry or the eclipse minimizer.")
          print()

          differences = []

          try:
              for case in cases:
                  reference = case["reference"]
                  jd_utc = iso_to_jd(reference)
                  year = decimal_year(reference)

                  engine_delta_t = eclipse_engine.delta_t_seconds(year)
                  engine_jd_tdb = eclipse_engine.utc_to_tdb_approx(jd_utc)

                  spice_et = spice.str2et(reference)
                  spice_jd_tdb = 2451545.0 + spice_et / DAY_S

                  difference_seconds = (
                      engine_jd_tdb - spice_jd_tdb
                  ) * DAY_S
                  differences.append(difference_seconds)

                  engine_offset_seconds = (
                      engine_jd_tdb - jd_utc
                  ) * DAY_S
                  spice_offset_seconds = (
                      spice_jd_tdb - jd_utc
                  ) * DAY_S

                  print("-" * 92)
                  print(f"{case['label']} [{case['group']}]")
                  print(f"Reference UTC:                {reference}")
                  print(f"Decimal year:                 {year:.9f}")
                  print(f"JD UTC:                       {jd_utc:.12f}")
                  print(f"Engine Delta-T model:         {engine_delta_t:+.6f} s")
                  print(f"Engine JD TDB approx:         {engine_jd_tdb:.12f}")
                  print(f"SPICE JD TDB:                 {spice_jd_tdb:.12f}")
                  print(f"Engine UTC->TDB offset:       {engine_offset_seconds:+.6f} s")
                  print(f"SPICE UTC->TDB offset:        {spice_offset_seconds:+.6f} s")
                  print(f"ENGINE - SPICE:               {difference_seconds:+.6f} s")
                  print()

              print("=" * 92)
              print("SUMMARY")
              print("=" * 92)
              print(f"Cases:                        {len(differences)}")
              if differences:
                  print(
                      "Minimum ENGINE - SPICE:       "
                      f"{min(differences):+.6f} s"
                  )
                  print(
                      "Maximum ENGINE - SPICE:       "
                      f"{max(differences):+.6f} s"
                  )
                  print(
                      "Largest absolute difference:  "
                      f"{max(abs(x) for x in differences):.6f} s"
                  )
              print()
              print("DIAGNOSTIC COMPLETE")

          finally:
              spice.kclear()
          PY

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de441-eclipse-timescale
          path: de441-eclipse-timescale.txt
          if-no-files-found: warn
          retention-days: 7
