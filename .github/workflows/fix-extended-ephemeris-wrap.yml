name: Fix extended ephemeris wrapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-extended-ephemeris-wrap.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fix publisher CSS and regenerate weekly pages
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('publish_weekly_pages.py')
          text = path.read_text()
          old = "table.extended-ephemeris th,table.extended-ephemeris td { width:25%; min-width:0; white-space:normal; overflow-wrap:normal; word-break:normal; }"
          new = "table.extended-ephemeris th { width:25%; min-width:0; white-space:nowrap; }\ntable.extended-ephemeris td { width:25%; min-width:0; white-space:normal; overflow-wrap:normal; word-break:normal; }"
          if old not in text:
              raise SystemExit('Expected extended ephemeris CSS rule not found')
          path.write_text(text.replace(old, new, 1))
          PY
          python publish_weekly_pages.py

      - name: Commit source fix and regenerated pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_weekly_pages.py site/2026
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Keep extended ephemeris body names intact"
          git push
