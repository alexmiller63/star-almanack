

name: Validate DE441 Eclipse Subset

on:

  workflow_dispatch:

permissions:

  contents: read

jobs:

  validate-de441-subset:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

          echo "$GITHUB_WORKSPACE/cspice/exe" >> "$GITHUB_PATH"

      - name: Verify source checksums

        run: |

          echo "=== DE441 SOURCE SHA-256 ==="

          sha256sum de441_part-1.bsp de441_part-2.bsp

          echo

          echo "=== NAIF LSK SHA-256 ==="

          sha256sum naif0012.tls

      - name: Rebuild Star Almanack DE441 eclipse subset

        run: |

          spkmerge de441-eclipse-subset.mrg

      - name: Verify rebuilt subset checksum and size

        run: |

          echo "=== REBUILT SUBSET SHA-256 ==="

          sha256sum de441-star-almanack-eclipses.bsp

          echo

          echo "=== EXPECTED SHA-256 ==="

          echo "0f5858ef3369c33d2ecd7111ffba37d76bb9f18908da44bdb41fa7b58d89ad17"

          echo

          echo "=== EXACT BYTE COUNT ==="

          stat --format="%n %s bytes" de441-star-almanack-eclipses.bsp

          echo

          echo "=== VERIFY EXPECTED CHECKSUM ==="

          echo \

            "0f5858ef3369c33d2ecd7111ffba37d76bb9f18908da44bdb41fa7b58d89ad17  de441-star-almanack-eclipses.bsp" \

            | sha256sum --check -

      - name: Compare DE441 states with subset

        shell: bash

        run: |

          set -euo pipefail

          # SPKDIFF compares two independently loaded trajectories.

          #

          # Trajectory 1:

          #   Original JPL DE441, supplied by its two source kernels.

          #

          # Trajectory 2:

          #   Star Almanack's trimmed DE441 eclipse subset.

          #

          # We compare the same body, center, and reference frame on

          # both sides.  SPKDIFF's "dump" report contains:

          #

          #   time dx dy dz dvx dvy dvz

          #

          # An exact zero in all six difference columns means that the

          # subset reproduces the source state vector exactly at that

          # sampled epoch.

          #

          # We deliberately sample throughout the complete intended

          # Star Almanack interval, including ancient and future dates.

          #

          # The four retained NAIF body IDs are:

          #

          #   3   Earth-Moon barycenter

          #   10  Sun

          #   301 Moon

          #   399 Earth

          #

          # All comparisons are expressed relative to the Solar System

          # barycenter (0) in the J2000 inertial frame.

          BEGIN_TIME="2000 B.C. JAN 02 00:00:00 TDB"

          END_TIME="2999 DEC 30 00:00:00 TDB"

          STATES=10001

          bodies=(

            "3:Earth-Moon barycenter"

            "10:Sun"

            "301:Moon"

            "399:Earth"

          )

          rm -f de441-comparison-summary.txt

          for entry in "${bodies[@]}"; do

            body="${entry%%:*}"

            name="${entry#*:}"

            report="spkdiff-${body}.txt"

            echo

            echo "============================================================"

            echo "Comparing ${name} (NAIF ${body})"

            echo "============================================================"

            spkdiff \

              -k naif0012.tls \

              -k1 de441_part-1.bsp de441_part-2.bsp \

              -k2 de441-star-almanack-eclipses.bsp \

              -b1 "$body" \

              -b2 "$body" \

              -c1 0 \

              -c2 0 \

              -r1 J2000 \

              -r2 J2000 \

              -b "$BEGIN_TIME" \

              -e "$END_TIME" \

              -n "$STATES" \

              -d 17 \

              -t dump \

              > "$report"

            python3 - "$report" "$name" "$body" <<'PY'

          import math

          import sys

          path, name, body = sys.argv[1:4]

          count = 0

          max_position_component = 0.0

          max_velocity_component = 0.0

          first_nonzero = None

          with open(path, "r", encoding="utf-8") as handle:

              for line in handle:

                  line = line.strip()

                  if not line or line.startswith("#"):

                      continue

                  fields = line.split()

                  if len(fields) != 7:

                      raise SystemExit(

                          f"Unexpected SPKDIFF data line in {path}: {line}"

                      )

                  epoch = float(fields[0])

                  differences = [float(value) for value in fields[1:]]

                  if not all(math.isfinite(value) for value in differences):

                      raise SystemExit(

                          f"Non-finite SPKDIFF result for {name}: {line}"

                      )

                  position = differences[:3]

                  velocity = differences[3:]

                  max_position_component = max(

                      max_position_component,

                      *(abs(value) for value in position),

                  )

                  max_velocity_component = max(

                      max_velocity_component,

                      *(abs(value) for value in velocity),

                  )

                  if first_nonzero is None and any(

                      value != 0.0 for value in differences

                  ):

                      first_nonzero = (epoch, differences)

                  count += 1

          if count == 0:

              raise SystemExit(

                  f"FAIL: SPKDIFF produced no comparison states for {name}."

              )

          print(f"Body: {name} ({body})")

          print(f"States compared: {count}")

          print(

              "Maximum absolute position-component difference: "

              f"{max_position_component:.17e} km"

          )

          print(

              "Maximum absolute velocity-component difference: "

              f"{max_velocity_component:.17e} km/s"

          )

          if first_nonzero is not None:

              epoch, differences = first_nonzero

              print()

              print("FAIL: subset differs from original DE441.")

              print(f"First non-zero epoch, TDB seconds past J2000: {epoch}")

              print(f"State differences: {differences}")

              raise SystemExit(1)

          print("PASS: every sampled state component is exactly identical.")

          PY

            {

              echo "${name} (NAIF ${body})"

              echo "  report: ${report}"

              echo "  states requested: ${STATES}"

              echo

            } >> de441-comparison-summary.txt

          done

      - name: Check eclipse-critical relative geometry

        shell: bash

        run: |

          set -euo pipefail

          # The previous test verifies each retained body's barycentric

          # state.  These additional comparisons exercise the relative

          # geometries used directly by solar-eclipse calculations:

          #

          #   Sun relative to Earth

          #   Moon relative to Earth

          #

          # This is intentionally redundant.  If the underlying SPK

          # chaining behaves differently than expected, these tests

          # catch it at the geometry level that matters to the Almanack.

          BEGIN_TIME="2000 B.C. JAN 02 00:00:00 TDB"

          END_TIME="2999 DEC 30 00:00:00 TDB"

          STATES=10001

          compare_geometry () {

            body="$1"

            center="$2"

            label="$3"

            report="$4"

            echo

            echo "============================================================"

            echo "${label}"

            echo "============================================================"

            spkdiff \

              -k naif0012.tls \

              -k1 de441_part-1.bsp de441_part-2.bsp \

              -k2 de441-star-almanack-eclipses.bsp \

              -b1 "$body" \

              -b2 "$body" \

              -c1 "$center" \

              -c2 "$center" \

              -r1 J2000 \

              -r2 J2000 \

              -b "$BEGIN_TIME" \

              -e "$END_TIME" \

              -n "$STATES" \

              -d 17 \

              -t dump \

              > "$report"

            python3 - "$report" "$label" <<'PY'

          import math

          import sys

          path, label = sys.argv[1:3]

          count = 0

          maximum = 0.0

          first_nonzero = None

          with open(path, "r", encoding="utf-8") as handle:

              for line in handle:

                  line = line.strip()

                  if not line or line.startswith("#"):

                      continue

                  fields = line.split()

                  if len(fields) != 7:

                      raise SystemExit(

                          f"Unexpected SPKDIFF data line in {path}: {line}"

                      )

                  epoch = float(fields[0])

                  differences = [float(value) for value in fields[1:]]

                  if not all(math.isfinite(value) for value in differences):

                      raise SystemExit(

                          f"Non-finite SPKDIFF result for {label}: {line}"

                      )

                  maximum = max(

                      maximum,

                      *(abs(value) for value in differences),

                  )

                  if first_nonzero is None and any(

                      value != 0.0 for value in differences

                  ):

                      first_nonzero = (epoch, differences)

                  count += 1

          if count == 0:

              raise SystemExit(

                  f"FAIL: no states were compared for {label}."

              )

          print(f"Geometry: {label}")

          print(f"States compared: {count}")

          print(f"Maximum state-component difference: {maximum:.17e}")

          if first_nonzero is not None:

              epoch, differences = first_nonzero

              print()

              print("FAIL: relative geometry differs.")

              print(f"First non-zero epoch, TDB seconds past J2000: {epoch}")

              print(f"State differences: {differences}")

              raise SystemExit(1)

          print("PASS: relative geometry is exactly identical.")

          PY

          }

          compare_geometry \

            10 399 \

            "Sun relative to Earth" \

            spkdiff-sun-from-earth.txt

          compare_geometry \

            301 399 \

            "Moon relative to Earth" \

            spkdiff-moon-from-earth.txt

      - name: Final validation result

        run: |

          echo

          echo "============================================================"

          echo "DE441 SUBSET VALIDATION: PASS"

          echo "============================================================"

          echo

          echo "The Star Almanack DE441 eclipse subset:"

          echo

          echo "  * rebuilds to the expected SHA-256 checksum"

          echo "  * preserves Earth-Moon barycenter states"

          echo "  * preserves Sun states"

          echo "  * preserves Moon states"

          echo "  * preserves Earth states"

          echo "  * preserves Sun-from-Earth geometry"

          echo "  * preserves Moon-from-Earth geometry"

          echo

          echo "All sampled state-vector components are identical to"

          echo "the original NASA/JPL DE441 source kernels."

      - name: Save validation reports

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: de441-subset-validation

          path: |

            de441-comparison-summary.txt

            spkdiff-3.txt

            spkdiff-10.txt

            spkdiff-301.txt

            spkdiff-399.txt

            spkdiff-sun-from-earth.txt

            spkdiff-moon-from-earth.txt

          if-no-files-found: warn

          retention-days: 7