name: Generate 2026 fixed-object sky notes

"on":
  workflow_dispatch:
  push:
    paths:
      - fixed-objects.yaml
      - in_milky_way.py
      - data/milky-way/vieira-outer.json
      - generate_fixed_object_sky_notes_2026.py
      - .github/workflows/generate-fixed-object-sky-notes-2026.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Generate observing notes
        run: python generate_fixed_object_sky_notes_2026.py

      - name: Validate output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('fixed-object-sky-notes-2026.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          if not rows:
              raise SystemExit('No observing notes generated')
          required = {'naked_eye', 'binoculars', 'telescope', 'iso', 'in_milky_way'}
          if not required.issubset(rows[0]):
              raise SystemExit('Missing output columns')
          if any(not r['naked_eye'] or not r['binoculars'] or not r['telescope'] for r in rows):
              raise SystemExit('Blank observing note found')
          if any(not r['iso'].startswith('2026-W') for r in rows):
              raise SystemExit('Non-ISO-2026 row found')
          lookup = {(r['category'], r['object'], r['constellation']): r for r in rows}
          if lookup[('messier', 'M8', 'Sgr')]['in_milky_way'] != 'yes':
              raise SystemExit('M8 Milky Way classification lost')
          if lookup[('messier', 'M31', 'And')]['in_milky_way'] != 'no':
              raise SystemExit('M31 Milky Way classification lost')
          print(f'rows={len(rows)} validation=PASS')
          PY

      - name: Commit observing notes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixed-object-sky-notes-2026.csv
          if git diff --cached --quiet; then
            echo 'No sky-note changes.'
            exit 0
          fi
          git commit -m 'Generate 2026 fixed-object sky notes'
          git push
