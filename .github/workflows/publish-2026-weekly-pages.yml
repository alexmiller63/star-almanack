# Weekly-page publish with notation and portrait-layout regression checks
name: Publish 2026 Weekly Pages

on:
  workflow_dispatch:
  push:
    paths:
      - almanack-expanded.md
      - publish_weekly_pages.py
      - add_greek_latin_toggle.py
      - add_observing_aid_notation.py
      - .github/workflows/publish-2026-weekly-pages.yml

permissions:
  contents: write

concurrency:
  group: star-almanack-2026-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Generate 53 weekly HTML pages
        run: python publish_weekly_pages.py

      - name: Add Greek Latin Bayer toggle
        run: python add_greek_latin_toggle.py

      - name: Make observing aids notation-aware
        run: python add_observing_aid_notation.py

      - name: Add deployment diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path
          markers = {
              'W01': '<p id="kilroy-deployment-diagnostic" style="text-align:center;font-family:system-ui,sans-serif;font-weight:700;border:2px solid currentColor;padding:.5rem;margin:1rem 0">KILROY WAS HERE — BUILD 2026-09-05 02:12 PDT</p>',
              'W41': '<p id="kilroy-w41-deployment-diagnostic" style="text-align:center;font-family:system-ui,sans-serif;font-weight:700;border:2px solid currentColor;padding:.5rem;margin:1rem 0">KILROY WAS HERE — W41 EXTENDED EPHEMERIS</p>',
          }
          for week, marker in markers.items():
              page = Path('site/2026') / week / 'index.html'
              text = page.read_text(encoding='utf-8')
              text = text.replace('<main class="wrap">', '<main class="wrap">' + marker, 1)
              page.write_text(text, encoding='utf-8')
          PY

      - name: Validate publishing output
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('site/2026')
          pages = sorted(root.glob('W??/index.html'))
          assert len(pages) == 53, f'Expected 53 weekly pages, found {len(pages)}'
          assert [p.parent.name for p in pages] == [f'W{i:02d}' for i in range(1,54)]
          assert (root / 'index.html').exists(), 'Missing 2026 index page'

          for i, page in enumerate(pages, 1):
              text = page.read_text(encoding='utf-8')
              assert f'ISO 2026-W{i:02d}' in text
              assert '<table class="calendar">' in text
              assert 'Best visibility:' not in text
              assert 'width:25%' in text and 'width:27%' in text and 'width:48%' in text
              assert '.event-parenthetical{white-space:nowrap}' in text
              assert 'data-bayer-mode="greek"' in text
              assert 'data-bayer-mode="latin"' in text
              assert 'data-bayer-mode="mixed"' in text
              assert "Peg:'Pegasi'" in text
              assert "const observingAids={'👁':'Naked eye','B':'Binoculars','🔭':'Telescope'}" in text, f'Observing-aid notation map missing in {page}'
              assert "s.dataset.observingAid='1'" in text, f'Observing-aid mode hook missing in {page}'
              assert '© 2026 Alexander Ferrari Miller. All rights reserved.' in text

          w41 = (root / 'W41' / 'index.html').read_text(encoding='utf-8')
          assert 'KILROY WAS HERE — W41 EXTENDED EPHEMERIS' in w41
          assert 'Enif (ε Peg)' in w41
          assert "Peg:'Pegasi'" in w41
          for glyph, name in [('♅','Uranus'), ('♆','Neptune'), ('⚳','Ceres')]:
              assert glyph in w41 and name in w41

          index = (root / 'index.html').read_text(encoding='utf-8')
          assert len(re.findall(r'href="W\d{2}/"', index)) == 53
          print('Verified 53 weekly pages including notation-aware observing aids')
          PY

      - name: Commit published pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/2026
          if git diff --cached --quiet; then
            echo "No publishing changes."
            exit 0
          fi
          git commit -m "Publish 53 weekly Star Almanack pages"
          git pull --rebase origin main
          git push
