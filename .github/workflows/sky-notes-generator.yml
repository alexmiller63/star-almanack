name: Sky Notes Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        type: string
      start_week:
        description: Start week
        required: true
        type: string
      end_year:
        description: End year (blank = one week)
        required: false
        default: ''
        type: string
      end_week:
        description: End week (blank = one week)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Resolve requested ISO weeks
        id: weeks
        run: |
          WEEKS=$(python generator_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}' --format csv)
          echo "weeks=$WEEKS" >> "$GITHUB_OUTPUT"
          echo "$WEEKS"

      - name: Generate requested Sky Notes
        run: |
          python generate_sky_notes_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}'

      - name: Commit Sky Notes and artwork handoff
        env:
          WEEKS: ${{ steps.weeks.outputs.weeks }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add almanack-expanded.md sky-note-artwork-descriptors-2026.json
          if git diff --cached --quiet; then
            echo 'No Sky Notes changes.'
            exit 0
          fi
          git commit -m "Generate Sky Notes $WEEKS"
          git pull --rebase origin main
          git push
