name: Verify Published Calendar Page

on:
  workflow_dispatch:
    inputs:
      year:
        description: Year
        required: true
        default: '2026'
      week:
        description: ISO week
        required: true
        default: '41'

jobs:
  chromium:
    name: Chromium rendered-page verification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Playwright Chromium
        run: |
          npm init -y >/dev/null 2>&1
          npm install --save-dev playwright
          npx playwright install --with-deps chromium

      - name: Verify canonical GitHub Pages deployment in Chromium
        env:
          YEAR: ${{ inputs.year }}
          WEEK: ${{ inputs.week }}
        run: |
          node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const year = process.env.YEAR;
            const week = String(process.env.WEEK).padStart(2, '0');

            // Canonical GitHub Pages deployment from start/rememberme.yaml.
            // Do not use the historical standalone star-almanack Pages path.
            const canonicalBase = 'https://alexmiller63.github.io/AlexanderFerrariMiller.com';
            const canonicalPath = `/almanack/${year}/W${week}/`;
            const url = `${canonicalBase}${canonicalPath}?verify=${Date.now()}`;

            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ viewport: { width: 390, height: 844 } });
            try {
              const response = await page.goto(url, {
                waitUntil: 'networkidle',
                timeout: 60000
              });

              if (!response || !response.ok()) {
                throw new Error(`Canonical Pages page did not load successfully: ${response && response.status()} ${url}`);
              }

              const finalUrl = new URL(page.url());
              const expectedHost = 'alexmiller63.github.io';
              const expectedPrefix = `/AlexanderFerrariMiller.com${canonicalPath}`;
              if (finalUrl.hostname !== expectedHost || !finalUrl.pathname.startsWith(expectedPrefix)) {
                throw new Error(`Chromium was redirected away from canonical GitHub Pages. Final URL: ${page.url()}`);
              }

              const calendar = page.locator('table.calendar');
              await calendar.waitFor({ state: 'visible', timeout: 15000 });

              // Portrait Latin mode is the regression surface for both reported layout bugs:
              // long zodiac names must fit, and Bayer parentheticals must not split across lines.
              const latinButton = page.locator('button[data-bayer-mode="latin"]');
              await latinButton.waitFor({ state: 'visible', timeout: 15000 });
              await latinButton.click();

              const layout = await page.evaluate(() => {
                const zodiac = [...document.querySelectorAll('table.calendar tbody td:nth-child(2)')].map((el) => ({
                  text: el.innerText.trim(),
                  clientWidth: el.clientWidth,
                  scrollWidth: el.scrollWidth,
                }));
                const parentheticals = [...document.querySelectorAll('.event-parenthetical')].map((el) => {
                  const rects = [...el.getClientRects()];
                  const cell = el.closest('td');
                  const r = el.getBoundingClientRect();
                  const c = cell.getBoundingClientRect();
                  return {
                    text: el.innerText,
                    lineFragments: rects.length,
                    left: r.left,
                    right: r.right,
                    cellLeft: c.left,
                    cellRight: c.right,
                  };
                });
                return { zodiac, parentheticals };
              });

              const overflowingZodiac = layout.zodiac.filter(x => x.scrollWidth > x.clientWidth + 1);
              if (overflowingZodiac.length) {
                throw new Error(`ZODIAC OVERFLOW: ${JSON.stringify(overflowingZodiac)}`);
              }

              const wrappedParentheticals = layout.parentheticals.filter(x =>
                x.lineFragments !== 1 || x.left < x.cellLeft - 1 || x.right > x.cellRight + 1
              );
              if (wrappedParentheticals.length) {
                throw new Error(`PARENTHETICAL WRAP/OVERFLOW: ${JSON.stringify(wrappedParentheticals)}`);
              }

              const latinCalendarText = await calendar.innerText();
              if (year === '2026' && week === '05') {
                if (!latinCalendarText.includes('Aquarius')) {
                  throw new Error('W05 regression: Aquarius is missing in Latin mode.');
                }
                if (!latinCalendarText.includes('Mintaka (Delta Orionis)')) {
                  throw new Error('W05 regression: Mintaka parenthetical did not render intact as (Delta Orionis).');
                }
                if (!latinCalendarText.includes('Arneb (Alpha Leporis)')) {
                  throw new Error('W05 regression: Arneb parenthetical did not render intact as (Alpha Leporis).');
                }
                if (layout.parentheticals.length === 0) {
                  throw new Error('W05 regression: no event parenthetical wrappers were rendered.');
                }
              }

              const mixedButton = page.locator('button[data-bayer-mode="mixed"]');
              await mixedButton.click();
              const calendarText = await calendar.innerText();
              console.log(`Canonical Pages URL: ${page.url()}`);
              console.log('Rendered calendar text:');
              console.log(calendarText);

              // W41 is the regression case that exposed stale deployment content.
              // A green result must mean Chromium sees the current rendered wording,
              // not merely that repository source or a different deployment is correct.
              if (year === '2026' && week === '41') {
                const expected = 'Enif (ε Epsilon Pegasi)';
                const stale = 'Enif (ε Epsilon Peg)';

                if (!calendarText.includes(expected)) {
                  throw new Error(
                    `STALE OR WRONG DEPLOYMENT: expected rendered text "${expected}" on canonical GitHub Pages.`
                  );
                }
                if (calendarText.includes(stale)) {
                  throw new Error(
                    `STALE DEPLOYMENT: rendered text "${stale}" is still present on canonical GitHub Pages.`
                  );
                }
              }

              console.log(`PASS: Chromium verified canonical GitHub Pages portrait layout for ${year}-W${week}.`);
            } finally {
              await browser.close();
            }
          })().catch(err => {
            console.error(err.stack || err);
            process.exit(1);
          });
          JS
