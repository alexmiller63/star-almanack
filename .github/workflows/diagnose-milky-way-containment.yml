name: Diagnose Milky Way containment

"on":
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/diagnose-milky-way-containment.yml

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check shapely
      - name: Compare containment methods
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from shapely.geometry import shape, Point
          from in_milky_way import in_milky_way, _ra_to_geojson_lon

          data = json.loads(Path('data/milky-way/vieira-outer.json').read_text())
          geom = shape(data['geometry'])
          print('geometry', geom.geom_type, 'parts', len(getattr(geom, 'geoms', [])))
          print('bounds', geom.bounds)

          tests = [
              ('M8', 18.06333333, -24.38333333),
              ('M44', 8.66833333, 19.98333333),
              ('M31', 0.69666667, 41.26666667),
              ('M35', 6.14833333, 24.33333333),
              ('Deneb', 20.690528, 45.280333),
              ('Galactic center', 17.761133, -29.007806),
              ('Galactic anticenter', 5.771, 28.936),
              ('North celestial pole', 0.0, 90.0),
          ]
          for label, ra, dec in tests:
              lon = _ra_to_geojson_lon(ra)
              p = Point(lon, dec)
              print(label, 'lon', lon, 'shapely', geom.covers(p), 'current', in_milky_way(ra, dec))
          PY
