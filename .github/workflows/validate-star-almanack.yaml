name: Validate Star Almanack

on:

  workflow_dispatch:

  push:

    paths:

      - "star-almanack-elp82b/**"

      - "eclipse-validation-cases.yaml"

      - "validate_star_almanack.py"

      - "sun_jpl_diagnostic.py"

      - ".github/workflows/validate-star-almanack.yaml"

permissions:

  contents: read

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Set up Python

        uses: actions/setup-python@v6

        with:

          python-version: "3.12"

      - name: Install validation dependency

        run: python -m pip install PyYAML

      - name: Bootstrap ELP2000-82B archive

        working-directory: star-almanack-elp82b

        run: python lunar_elp.py bootstrap data/elp82b

      - name: Verify ELP2000-82B archive

        working-directory: star-almanack-elp82b

        run: python lunar_elp.py verify data/elp82b

      - name: Normalize ELP2000-82B coefficients

        working-directory: star-almanack-elp82b

        run: python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Run JPL compact-Sun diagnostic

        run: python sun_jpl_diagnostic.py

      - name: Run complete Star Almanack validation

        run: python validate_star_almanack.py

