name: Validate Calendar Event Calculator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to calculate"
        required: true
        default: "2026"
        type: string
      end_year:
        description: "Last year to calculate; leave blank for one year"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install astronomical calculation dependencies
        run: python -m pip install --disable-pip-version-check spiceypy pyerfa

      - name: Prepare official ELP2000-82B coefficients
        working-directory: star-almanack-elp82b
        run: |
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Resolve requested year range
        id: years
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          python - <<'PY'
          import os
          import sys

          try:
              start = int(os.environ["START_YEAR"])
              end_text = os.environ["END_YEAR"].strip()
              end = start if not end_text else int(end_text)
          except ValueError:
              print("start_year and end_year must be integer years", file=sys.stderr)
              raise SystemExit(1)

          if start < 1900 or start > 2200 or end < 1900 or end > 2200:
              print("years must be between 1900 and 2200", file=sys.stderr)
              raise SystemExit(1)
          if end < start:
              print("end_year must be greater than or equal to start_year", file=sys.stderr)
              raise SystemExit(1)

          years = list(range(start, end + 1))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"start_year={start}\n")
              output.write(f"end_year={end}\n")
              output.write(f"includes_2026={str(start <= 2026 <= end).lower()}\n")
              output.write("years<<EOF\n")
              output.write("\n".join(str(year) for year in years))
              output.write("\nEOF\n")
          print(f"Requested years: {start}-{end}")

      - name: Calculate requested calendar events
        env:
          YEARS: ${{ steps.years.outputs.years }}
        run: |
          while read -r year; do
            [ -z "$year" ] || python generate_calendar_events.py "$year"
          done <<< "$YEARS"

      - name: Compare against accepted 2026 calendar
        if: steps.years.outputs.includes_2026 == 'true'
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, "star-almanack-elp82b")
          import eclipse_engine
          import lunar_elp

          accepted = Path("ISO2026.md").read_text(encoding="utf-8")
          calculated = json.loads(Path("calendar-events-2026.json").read_text(encoding="utf-8"))

          accepted_ingresses = {}
          for symbol, stamp in re.findall(
              r"\\| (♈|♉|♊|♋|♌|♍|♎|♏|♐|♑|♒|♓) \\([^|]+\\) \\| \\d+° \\| (2026-\\d\\d-\\d\\d \\d\\d:\\d\\d:\\d\\d) \\|",
              accepted,
          ):
              accepted_ingresses[symbol] = dt.datetime.fromisoformat(stamp).replace(tzinfo=dt.timezone.utc)

          accepted_phases = []
          for symbol, name, stamp in re.findall(
              r"\\| ([🌑🌓🌕🌗]) ([^|]+?) \\| (2026-\\d\\d-\\d\\d \\d\\d:\\d\\d:\\d\\d) \\|",
              accepted,
          ):
              accepted_phases.append((symbol, name.strip(), dt.datetime.fromisoformat(stamp).replace(tzinfo=dt.timezone.utc)))

          assert len(accepted_ingresses) == 12
          assert len(accepted_phases) in range(48, 52)
          assert len(calculated["zodiac_ingresses"]) == 12
          assert len(calculated["lunar_phases"]) == len(accepted_phases)

          ingress_errors = []
          for event in calculated["zodiac_ingresses"]:
              actual = dt.datetime.fromisoformat(event["utc"].replace("Z", "+00:00"))
              error = abs((actual - accepted_ingresses[event["symbol"]]).total_seconds())
              ingress_errors.append(error)

          phase_errors = []
          for event, reference in zip(calculated["lunar_phases"], accepted_phases):
              symbol, _, accepted_time = reference
              assert event["symbol"] == symbol
              actual = dt.datetime.fromisoformat(event["utc"].replace("Z", "+00:00"))
              phase_errors.append(abs((actual - accepted_time).total_seconds()))

          worst_ingress = max(range(len(ingress_errors)), key=ingress_errors.__getitem__)
          print("Ingress comparison:")
          for event, error in zip(calculated["zodiac_ingresses"], ingress_errors):
              if error > 120:
                  print(
                      f"  {event['symbol']} {event['name']}: "
                      f"calculated={event['utc']} "
                      f"accepted={accepted_ingresses[event['symbol']].isoformat()} "
                      f"difference={error:.0f}s"
                  )
          worst_event = calculated["zodiac_ingresses"][worst_ingress]
          print(
              f"  worst: {worst_event['symbol']} {ingress_errors[worst_ingress]:.0f}s"
          )
          assert max(ingress_errors) <= 120, max(ingress_errors)

          worst_phase = max(range(len(phase_errors)), key=phase_errors.__getitem__)
          worst_calculated = calculated["lunar_phases"][worst_phase]
          worst_reference = accepted_phases[worst_phase]
          signed_phase_error = (
              dt.datetime.fromisoformat(worst_calculated["utc"].replace("Z", "+00:00"))
              - worst_reference[2]
          ).total_seconds()
          print(
              f"Lunar-phase maximum difference: {phase_errors[worst_phase]:.0f}s"
          )
          print(
              f"  worst: {worst_calculated['symbol']} {worst_calculated['name']}: "
              f"calculated={worst_calculated['utc']} "
              f"accepted={worst_reference[2].isoformat()} "
              f"signed_difference={signed_phase_error:+.0f}s"
          )
          print("ELP table contributions at the two First Quarter candidates:")
          for label, stamp in (
              ("accepted", worst_reference[2]),
              ("calculated", dt.datetime.fromisoformat(worst_calculated["utc"].replace("Z", "+00:00"))),
          ):
              jd_utc = eclipse_engine.gregorian_to_jd(
                  stamp.year,
                  stamp.month,
                  stamp.day,
                  (
                      stamp.hour
                      + (stamp.minute + stamp.second / 60.0) / 60.0
                  ) / 24.0,
              )
              result = lunar_elp.evaluate(
                  lunar_elp.load_normalized(Path("star-almanack-elp82b/elp82b-manifest.json")),
                  eclipse_engine.utc_to_tdb_approx(jd_utc),
              )
              print(
                  f"  {label}: lunar longitude={result.spherical.longitude_rad * 180.0 / 3.141592653589793:.9f}° "
                  f"table_sums={[round(value, 6) for value in result.table_sums]}"
              )
          assert max(phase_errors) <= 120, max(phase_errors)
          print(f"2026 regression PASS: ingress max {max(ingress_errors):.0f}s; phase max {max(phase_errors):.0f}s")
          PY

      - name: Verify deterministic output
        env:
          YEARS: ${{ steps.years.outputs.years }}
        run: |
          : > /tmp/calendar-before.sha256
          while read -r year; do
            [ -z "$year" ] || sha256sum "calendar-events-$year.json" >> /tmp/calendar-before.sha256
          done <<< "$YEARS"
          while read -r year; do
            [ -z "$year" ] || python generate_calendar_events.py "$year"
          done <<< "$YEARS"
          : > /tmp/calendar-after.sha256
          while read -r year; do
            [ -z "$year" ] || sha256sum "calendar-events-$year.json" >> /tmp/calendar-after.sha256
          done <<< "$YEARS"
          diff -u /tmp/calendar-before.sha256 /tmp/calendar-after.sha256

      - name: Commit validated event data
        env:
          YEARS: ${{ steps.years.outputs.years }}
          START_YEAR: ${{ steps.years.outputs.start_year }}
          END_YEAR: ${{ steps.years.outputs.end_year }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          while read -r year; do
            [ -z "$year" ] || git add "calendar-events-$year.json"
          done <<< "$YEARS"
          if git diff --cached --quiet; then
            echo "Calendar event data already current."
            exit 0
          fi
          git commit -m "Calculate $START_YEAR-$END_YEAR calendar events"
          git pull --rebase origin main
          git push origin HEAD:main
