name: Validate ELP2000-82B

on:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Fortran compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran

      - name: Download official ELP2000-82B archive
        working-directory: star-almanack-elp82b
        run: python lunar_elp.py bootstrap data/elp82b

      - name: Verify all 36 coefficient tables
        working-directory: star-almanack-elp82b
        run: python lunar_elp.py verify data/elp82b

      - name: Compile reference Fortran routine
        working-directory: star-almanack-elp82b
        run: gfortran -c data/elp82b/elp82b.f -o elp82b-reference.o

      - name: Normalize ELP2000-82B tables
        working-directory: star-almanack-elp82b
        run: python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Evaluate April 8, 2024 eclipse test point
        working-directory: star-almanack-elp82b
        run: |
          # 2024-04-08 18:17 UTC, converted approximately to JD(TDB).
          python lunar_elp.py evaluate elp82b-manifest.json 2460409.262606

      - name: Save validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elp82b-validation
          path: |
            star-almanack-elp82b/elp82b-manifest.json
            star-almanack-elp82b/elp82b-reference.o
