name: Validate ELP2000-82B

on:

  workflow_dispatch:

jobs:

  validate:

    runs-on: ubuntu-latest

    steps:

      - name: Check out repository

        uses: actions/checkout@v4

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.12"

      - name: Bootstrap ELP2000-82B coefficient tables

        run: |

          python star-almanack-elp82b/lunar_elp.py bootstrap star-almanack-elp82b/data/elp82b

      - name: Normalize all 36 ELP2000-82B tables

        run: |

          python star-almanack-elp82b/normalize_elp82b.py \

            star-almanack-elp82b/data/elp82b \

            star-almanack-elp82b/elp82b-normalized.json

      - name: Validate April 8 2024 eclipse

        run: |

          python eclipse_coordinates.py \

            star-almanack-elp82b/elp82b-normalized.json \

            2024-04-08T18:17:00Z \

            --json

      - name: Upload normalized coefficient artifact

        uses: actions/upload-artifact@v4

        with:

          name: elp82b-normalized

          path: star-almanack-elp82b/elp82b-normalized.json

