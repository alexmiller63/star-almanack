name: Artwork Generator

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        type: string
      start_week:
        description: Start week
        required: true
        type: string
      end_year:
        description: End year (blank = one week)
        required: false
        default: ''
        type: string
      end_week:
        description: End week (blank = one week)
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install renderer dependency
        run: python -m pip install matplotlib==3.10.6

      - name: Fetch pinned HYG v4.1 catalog
        run: |
          curl -fL \
            https://raw.githubusercontent.com/astronexus/HYG-Database/3bf37f4b2d5460e1278286320d1d62fab9b493c1/hyg/CURRENT/hygdata_v41.csv \
            -o /tmp/hygdata_v41.csv

      - name: Resolve requested ISO weeks
        id: weeks
        run: |
          WEEKS=$(python generator_week_range.py \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}' --format csv)
          echo "weeks=$WEEKS" >> "$GITHUB_OUTPUT"
          echo "$WEEKS"

      - name: Render requested artwork
        run: |
          python generate_artwork_range.py /tmp/hygdata_v41.csv \
            '${{ inputs.start_year }}' '${{ inputs.start_week }}' \
            '${{ inputs.end_year }}' '${{ inputs.end_week }}'

      - name: Commit requested artwork
        env:
          WEEKS: ${{ steps.weeks.outputs.weeks }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          IFS=',' read -ra ITEMS <<< "$WEEKS"
          for iso in "${ITEMS[@]}"; do
            year="${iso%%-W*}"
            week="W${iso##*-W}"
            if [ -d "observer-views/$year/$week" ]; then
              git add "observer-views/$year/$week"
            fi
          done
          if git diff --cached --quiet; then
            echo 'No artwork changes.'
            exit 0
          fi
          git commit -m "Generate artwork $WEEKS"
          git pull --rebase origin main
          git push
