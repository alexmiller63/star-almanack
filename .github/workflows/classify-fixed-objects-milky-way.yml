name: Classify fixed objects in Milky Way

"on":
  workflow_dispatch:
  push:
    paths:
      - fixed-objects.yaml
      - in_milky_way.py
      - data/milky-way/vieira-outer.json
      - classify_fixed_objects_milky_way.py
      - .github/workflows/classify-fixed-objects-milky-way.yml

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Classify all fixed objects
        run: python classify_fixed_objects_milky_way.py

      - name: Sanity check output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          p = Path('fixed-object-milky-way.csv')
          rows = list(csv.DictReader(p.open(encoding='utf-8')))
          if not rows:
              raise SystemExit('No fixed objects were classified')
          if any(r['in_milky_way'] not in {'yes', 'no'} for r in rows):
              raise SystemExit('Invalid classification value')
          print(f'rows={len(rows)} yes={sum(r["in_milky_way"] == "yes" for r in rows)} no={sum(r["in_milky_way"] == "no" for r in rows)}')
          PY

      - name: Commit classification sidecar
        run: |
          if git diff --quiet -- fixed-object-milky-way.csv; then
            echo 'No classification changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fixed-object-milky-way.csv
          git commit -m 'Classify fixed objects by Milky Way region'
          git push
