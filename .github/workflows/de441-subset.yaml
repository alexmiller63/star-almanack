name: Diagnose DE441 Eclipse Subset

on:

  workflow_dispatch:

permissions:

  contents: read

jobs:

  diagnose-de441:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Start debug.txt

        run: |

          echo "Star Almanack DE441 subset diagnostic" > debug.txt

          echo "Started: $(date -u)" >> debug.txt

          echo "" >> debug.txt

          echo "Runner:" >> debug.txt

          uname -a >> debug.txt

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF SPICE Toolkit

        run: |

          wget -q https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

          test -x ./cspice/exe/brief

      - name: Record source sizes and checksums

        run: |

          echo "" >> debug.txt

          echo "===== DE441 SOURCE FILES =====" >> debug.txt

          ls -lh de441_part-1.bsp de441_part-2.bsp >> debug.txt

          echo "" >> debug.txt

          echo "SHA-256:" >> debug.txt

          sha256sum de441_part-1.bsp de441_part-2.bsp >> debug.txt

      - name: Inspect DE441 part 1

        run: |

          echo "" >> debug.txt

          echo "===== BRIEF: DE441 PART 1 =====" >> debug.txt

          ./cspice/exe/brief de441_part-1.bsp >> debug.txt 2>&1

      - name: Inspect DE441 part 2

        run: |

          echo "" >> debug.txt

          echo "===== BRIEF: DE441 PART 2 =====" >> debug.txt

          ./cspice/exe/brief de441_part-2.bsp >> debug.txt 2>&1

      - name: Record bodies relevant to eclipse kernel

        run: |

          echo "" >> debug.txt

          echo "===== TARGET BODY/CENTER CHAIN TO VERIFY =====" >> debug.txt

          echo "10  = Sun" >> debug.txt

          echo "3   = Earth-Moon barycenter" >> debug.txt

          echo "399 = Earth" >> debug.txt

          echo "301 = Moon" >> debug.txt

          echo "" >> debug.txt

          echo "Use the BRIEF output above to determine which of these segments and centers are actually required before building the subset." >> debug.txt

          echo "Finished: $(date -u)" >> debug.txt

      - name: Show debug.txt

        if: always()

        run: cat debug.txt

      - name: Upload diagnostic

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: de441-diagnostic

          path: debug.txt

          if-no-files-found: error