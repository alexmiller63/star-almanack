name: Build DE441 Eclipse Subset

on:

  workflow_dispatch:

permissions:

  contents: read

jobs:

  build-de441-subset:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

          echo "$GITHUB_WORKSPACE/cspice/exe" >> "$GITHUB_PATH"

      - name: Record source checksums

        run: |

          echo "=== DE441 SOURCE SHA-256 ==="

          sha256sum de441_part-1.bsp de441_part-2.bsp | tee de441-source-sha256.txt

          echo

          echo "=== NAIF LSK SHA-256 ==="

          sha256sum naif0012.tls | tee naif-lsk-sha256.txt

      - name: Build Star Almanack DE441 eclipse subset

        run: |

          spkmerge de441-eclipse-subset.mrg

      - name: Report sizes

        run: |

          echo "=== ORIGINAL DE441 ==="

          ls -lh de441_part-1.bsp de441_part-2.bsp

          echo

          echo "=== STAR ALMANACK SUBSET ==="

          ls -lh de441-star-almanack-eclipses.bsp

          echo

          echo "=== EXACT BYTE COUNT ==="

          stat --format="%n %s bytes" de441-star-almanack-eclipses.bsp

      - name: Record subset checksum

        run: |

          echo "=== STAR ALMANACK SUBSET SHA-256 ==="

          sha256sum de441-star-almanack-eclipses.bsp | tee de441-subset-sha256.txt

      - name: Write provenance record

        run: |

          {

            echo "Star Almanack DE441 Eclipse Subset"

            echo "=================================="

            echo

            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            echo

            echo "Source: NASA/JPL NAIF DE441"

            echo "Coverage requested: 2000 B.C. through A.D. 3000"

            echo "Bodies requested: 3, 10, 301, 399"

            echo

            echo "Source SHA-256:"

            cat de441-source-sha256.txt

            echo

            echo "Leap-seconds kernel SHA-256:"

            cat naif-lsk-sha256.txt

            echo

            echo "Subset SHA-256:"

            cat de441-subset-sha256.txt

            echo

            echo "Subset exact size:"

            stat --format="%s bytes" de441-star-almanack-eclipses.bsp

          } | tee de441-subset-provenance.txt

      - name: Save subset and provenance as workflow artifact

        uses: actions/upload-artifact@v4

        with:

          name: de441-star-almanack-eclipses

          path: |

            de441-star-almanack-eclipses.bsp

            de441-star-almanack-eclipses.log

            de441-source-sha256.txt

            naif-lsk-sha256.txt

            de441-subset-sha256.txt

            de441-subset-provenance.txt

          retention-days: 7

