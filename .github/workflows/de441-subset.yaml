name: Build DE441 Eclipse Subset

on:

  workflow_dispatch:

permissions:

  contents: write

jobs:

  build-de441-subset:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Start debug.txt

        run: |

          {

            echo "Star Almanack — DE441 Eclipse Subset Build"

            echo "=========================================="

            echo

            echo "Generated: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"

            echo "Git commit: $GITHUB_SHA"

            echo "GitHub Actions run: $GITHUB_RUN_ID"

            echo

          } > debug.txt

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

          echo "$GITHUB_WORKSPACE/cspice/exe" >> "$GITHUB_PATH"

      - name: Record source checksums

        run: |

          {

            echo "DE441 source SHA-256"

            echo "--------------------"

            sha256sum de441_part-1.bsp de441_part-2.bsp

            echo

            echo "NAIF leap-seconds kernel SHA-256"

            echo "--------------------------------"

            sha256sum naif0012.tls

            echo

          } >> debug.txt

      - name: Build Star Almanack DE441 eclipse subset

        run: |

          spkmerge de441-eclipse-subset.mrg

      - name: Record subset information

        run: |

          {

            echo "Star Almanack subset"

            echo "--------------------"

            echo "File: de441-star-almanack-eclipses.bsp"

            echo "Coverage requested: 2000 B.C. through A.D. 3000"

            echo "Bodies requested: 3, 10, 301, 399"

            echo

            echo "Exact size:"

            stat --format="%s bytes" de441-star-almanack-eclipses.bsp

            echo

            echo "SHA-256:"

            sha256sum de441-star-almanack-eclipses.bsp

            echo

            echo "Build completed successfully."

          } >> debug.txt

      - name: Show debug.txt

        run: cat debug.txt

      - name: Publish GitHub Release

        env:

          GH_TOKEN: ${{ github.token }}

        run: |

          TAG="de441-eclipse-subset-${GITHUB_RUN_NUMBER}"

          gh release create "$TAG" \

            de441-star-almanack-eclipses.bsp \

            debug.txt \

            --repo "$GITHUB_REPOSITORY" \

            --title "Star Almanack DE441 Eclipse Subset" \

            --notes "Generated from NASA/JPL DE441 by GitHub Actions. See debug.txt for provenance, checksums, and build diagnostics."