name: Diagnose DE441 Eclipse Subset

on:

  workflow_dispatch:

permissions:

  contents: read

jobs:

  diagnose-de441:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Start debug.txt

        run: |

          echo "Star Almanack DE441 subset diagnostic" > debug.txt

          echo "Started: $(date -u)" >> debug.txt

          echo "" >> debug.txt

          echo "Runner:" >> debug.txt

          uname -a >> debug.txt

          df -h >> debug.txt

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q \

            https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

      - name: Record source sizes and checksums

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "SOURCE FILE SIZES" >> debug.txt

          echo "==================================================" >> debug.txt

          ls -lh de441_part-1.bsp >> debug.txt

          ls -lh de441_part-2.bsp >> debug.txt

          ls -l de441_part-1.bsp >> debug.txt

          ls -l de441_part-2.bsp >> debug.txt

          echo "" >> debug.txt

          echo "Source kernel SHA-256 checksums:" >> debug.txt

          sha256sum de441_part-1.bsp >> debug.txt

          sha256sum de441_part-2.bsp >> debug.txt

          sha256sum naif0012.tls >> debug.txt

      - name: Record SPICE Toolkit version

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "SPICE TOOLKIT" >> debug.txt

          echo "==================================================" >> debug.txt

          ./cspice/exe/brief -v >> debug.txt 2>&1 || true

      - name: Inspect DE441 part 1

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "DE441 PART 1 — BODY / CENTER / COVERAGE" >> debug.txt

          echo "==================================================" >> debug.txt

          ./cspice/exe/brief -c -t -s de441_part-1.bsp \

            >> debug.txt 2>&1

      - name: Inspect DE441 part 2

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "DE441 PART 2 — BODY / CENTER / COVERAGE" >> debug.txt

          echo "==================================================" >> debug.txt

          ./cspice/exe/brief -c -t -s de441_part-2.bsp \

            >> debug.txt 2>&1

      - name: Inspect DE441 parts together

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "DE441 COMBINED — BODY / CENTER / COVERAGE" >> debug.txt

          echo "==================================================" >> debug.txt

          ./cspice/exe/brief -a -c -t -s \

            de441_part-1.bsp \

            de441_part-2.bsp \

            >> debug.txt 2>&1

      - name: Inspect eclipse-related NAIF bodies

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "ECLIPSE-RELATED BODY IDS" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "10  = Sun" >> debug.txt

          echo "301 = Moon" >> debug.txt

          echo "399 = Earth" >> debug.txt

          echo "3   = Earth-Moon barycenter" >> debug.txt

          echo "" >> debug.txt

          echo "Sun segments:" >> debug.txt

          ./cspice/exe/brief -c -t -s -sb10 \

            de441_part-1.bsp de441_part-2.bsp \

            >> debug.txt 2>&1 || true

          echo "" >> debug.txt

          echo "Moon segments:" >> debug.txt

          ./cspice/exe/brief -c -t -s -sb301 \

            de441_part-1.bsp de441_part-2.bsp \

            >> debug.txt 2>&1 || true

          echo "" >> debug.txt

          echo "Earth segments:" >> debug.txt

          ./cspice/exe/brief -c -t -s -sb399 \

            de441_part-1.bsp de441_part-2.bsp \

            >> debug.txt 2>&1 || true

          echo "" >> debug.txt

          echo "Earth-Moon barycenter segments:" >> debug.txt

          ./cspice/exe/brief -c -t -s -sb3 \

            de441_part-1.bsp de441_part-2.bsp \

            >> debug.txt 2>&1 || true

      - name: Record diagnostic conclusion

        run: |

          echo "" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "NEXT QUESTION" >> debug.txt

          echo "==================================================" >> debug.txt

          echo "Use the BRIEF output above to determine the exact" >> debug.txt

          echo "body/center chain required for Sun-Earth-Moon" >> debug.txt

          echo "eclipse calculations before building a subset." >> debug.txt

          echo "" >> debug.txt

          echo "Finished: $(date -u)" >> debug.txt

      - name: Show debug.txt

        if: always()

        run: cat debug.txt

      - name: Upload diagnostic

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: de441-diagnostic

          path: debug.txt