name: Build DE441 Eclipse Subset

on:

  workflow_dispatch:

  push:

permissions:

  contents: read

jobs:

  build-de441-subset:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Start debug.txt

        run: |

          echo "Star Almanack DE441 subset build" > debug.txt

          echo "Started: $(date -u)" >> debug.txt

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

          echo "$GITHUB_WORKSPACE/cspice/exe" >> "$GITHUB_PATH"

      - name: Record source sizes and checksums

        run: |

          echo "" >> debug.txt

          echo "DE441 source files:" >> debug.txt

          ls -lh de441_part-1.bsp de441_part-2.bsp >> debug.txt

          echo "" >> debug.txt

          echo "SHA-256 checksums:" >> debug.txt

          sha256sum de441_part-1.bsp de441_part-2.bsp >> debug.txt

      - name: Record SPICE Toolkit version

        run: |

          echo "" >> debug.txt

          echo "SPICE Toolkit:" >> debug.txt

          brief -v >> debug.txt 2>&1 || true

      - name: Inspect DE441 part 1

        run: |

          echo "" >> debug.txt

          echo "===== DE441 PART 1 =====" >> debug.txt

          brief de441_part-1.bsp >> debug.txt 2>&1

      - name: Inspect DE441 part 2

        run: |

          echo "" >> debug.txt

          echo "===== DE441 PART 2 =====" >> debug.txt

          brief de441_part-2.bsp >> debug.txt 2>&1

      - name: Create SPKMERGE command file

        run: |

          cat > spkmerge.txt <<'EOF'

          LEAPSECONDS_KERNEL = naif0012.tls

          SPK_KERNEL = de441-eclipse.bsp

            SOURCE_SPK_KERNEL = de441_part-1.bsp

              BODIES = 10 399 301

            SOURCE_SPK_KERNEL = de441_part-2.bsp

              BODIES = 10 399 301

          EOF

      - name: Build DE441 eclipse subset

        run: |

          spkmerge spkmerge.txt

      - name: Record subset information

        run: |

          echo "" >> debug.txt

          echo "===== DE441 ECLIPSE SUBSET =====" >> debug.txt

          ls -lh de441-eclipse.bsp >> debug.txt

          sha256sum de441-eclipse.bsp >> debug.txt

          brief de441-eclipse.bsp >> debug.txt 2>&1

          echo "" >> debug.txt

          echo "Finished: $(date -u)" >> debug.txt

      - name: Upload DE441 eclipse subset

        uses: actions/upload-artifact@v4

        with:

          name: de441-eclipse-subset

          path: |

            de441-eclipse.bsp

            debug.txt

            spkmerge.txt

          if-no-files-found: error