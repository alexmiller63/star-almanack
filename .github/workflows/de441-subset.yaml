name: Build DE441 Eclipse Subset

on:

  workflow_dispatch:
  push:

permissions:

  contents: read

jobs:

  build-de441-subset:

    runs-on: ubuntu-latest

    steps:

      - name: Check out Star Almanack

        uses: actions/checkout@v6

      - name: Start debug.txt

        run: |

          echo "Star Almanack DE441 subset build" > debug.txt

          echo "Started: $(date -u)" >> debug.txt

      - name: Download DE441 source kernels

        run: |

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-1.bsp

          wget -q --show-progress https://naif.jpl.nasa.gov/pub/naif/generic_kernels/spk/planets/de441_part-2.bsp

      - name: Download NAIF leap-seconds kernel

        run: |

          wget -q https://naif.jpl.nasa.gov/pub/naif/generic_kernels/lsk/naif0012.tls

      - name: Download and install NAIF SPICE Toolkit

        run: |

          wget -q https://naif.jpl.nasa.gov/pub/naif/toolkit/C/PC_Linux_GCC_64bit/packages/cspice.tar.Z

          tar -xzf cspice.tar.Z

      - name: Record source checksums

        run: |

          echo "" >> debug.txt

          echo "Source kernel checksums:" >> debug.txt

          sha256sum de441_part-1.bsp >> debug.txt

          sha256sum de441_part-2.bsp >> debug.txt

          sha256sum naif0012.tls >> debug.txt

      - name: Build Star Almanack DE441 eclipse subset

        run: |

          ./cspice/exe/spkmerge <<'EOF'

          LEAPSECONDS_KERNEL = naif0012.tls

          SPK_KERNEL = star-almanack-de441-eclipse.bsp

            SOURCE_SPK_KERNEL = de441_part-1.bsp

            SOURCE_SPK_KERNEL = de441_part-2.bsp

          EOF

      - name: Record subset information

        run: |

          echo "" >> debug.txt

          echo "Subset:" >> debug.txt

          ls -lh star-almanack-de441-eclipse.bsp >> debug.txt

          sha256sum star-almanack-de441-eclipse.bsp >> debug.txt

      - name: Show debug.txt

        if: always()

        run: cat debug.txt

      - name: Upload DE441 eclipse subset

        uses: actions/upload-artifact@v4

        with:

          name: star-almanack-de441-eclipse

          path: |

            star-almanack-de441-eclipse.bsp

            debug.txt