name: Fix lower weekly navigation
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fix-lower-nav.yml
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
      - name: Add lower navigation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('publish_weekly_pages.py')
          s = p.read_text(encoding='utf-8')
          old = '<main class="wrap">{nav}{body}</main>'
          new = '<main class="wrap">{nav}{body}{nav}</main>'
          assert s.count(old) == 1, f'Expected exactly one page shell target, found {s.count(old)}'
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
          grep -F '<main class="wrap">{nav}{body}{nav}</main>' publish_weekly_pages.py
      - name: Commit source change and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add publish_weekly_pages.py
          git rm .github/workflows/fix-lower-nav.yml
          git commit -m "Add lower weekly navigation"
          git push
