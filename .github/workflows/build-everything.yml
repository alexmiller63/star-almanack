name: Build Everything

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: Start year
        required: true
        default: '2025'
        type: string
      start_week:
        description: Start week
        required: true
        default: '01'
        type: string
      end_year:
        description: End year
        required: true
        default: '2028'
        type: string
      end_week:
        description: End week
        required: true
        default: '52'
        type: string

permissions:
  contents: write

concurrency:
  group: star-almanack-build-everything
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      START_YEAR: ${{ inputs.start_year }}
      START_WEEK: ${{ inputs.start_week }}
      END_YEAR: ${{ inputs.end_year }}
      END_WEEK: ${{ inputs.end_week }}
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve and validate ISO-week range
        run: |
          python - <<'PY'
          import os

          from iso_week_range import IsoWeekRange

          try:
              first = f"{int(os.environ['START_YEAR']):04d}-W{int(os.environ['START_WEEK']):02d}"
              last = f"{int(os.environ['END_YEAR']):04d}-W{int(os.environ['END_WEEK']):02d}"
              requested = IsoWeekRange.parse(first, last)
          except ValueError as error:
              raise SystemExit(f"Invalid requested week range: {error}") from error

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              output.write(f"FIRST_ISO_WEEK={requested.first}\n")
              output.write(f"LAST_ISO_WEEK={requested.last}\n")
          print(f"Building {requested.first} through {requested.last} ({len(requested)} weeks)")
          PY

      - name: Install calculation dependencies
        run: python -m pip install --disable-pip-version-check pyyaml spiceypy pyerfa

      - name: Prepare official ELP2000-82B coefficients
        working-directory: star-almanack-elp82b
        run: |
          python lunar_elp.py bootstrap data/elp82b
          python lunar_elp.py verify data/elp82b
          python normalize_elp82b.py data/elp82b elp82b-manifest.json

      - name: Validate generator contracts
        run: python -m unittest discover -s tests -v

      - name: Build everything from start to finish
        run: python build_almanack_range.py "$FIRST_ISO_WEEK" "$LAST_ISO_WEEK"

      - name: Verify range, ownership, and boundary menus
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          from iso_week_range import IsoWeekRange

          requested = IsoWeekRange.parse(os.environ["FIRST_ISO_WEEK"], os.environ["LAST_ISO_WEEK"])
          pages = [Path("site") / str(item.year) / f"W{item.week:02d}" / "index.html" for item in requested.weeks()]
          assert len(pages) == len(requested)
          assert all(path.exists() for path in pages)

          first = pages[0].read_text(encoding="utf-8")
          last = pages[-1].read_text(encoding="utf-8")
          assert '<span>← Previous</span>' in first
          assert '<span>Next →</span>' in last
          assert 'data-bayer-mode="greek"' in first
          assert 'const observingAids=' in first
          assert 'aria-label="Astronomical notation legend"' in first

          for item, path in zip(requested.weeks(), pages):
              text = path.read_text(encoding="utf-8")
              assert f"ISO {item.year}-W{item.week:02d}" in text
              assert text.count("All weeks") == 2
              if item != requested.first:
                  assert "← Previous</span>" not in text
              if item != requested.last:
                  assert "Next →</span>" not in text

          weeks = requested.weeks()
          for current, following in zip(weeks, weeks[1:]):
              if current.year != following.year:
                  text = (Path("site") / str(current.year) / f"W{current.week:02d}" / "index.html").read_text(encoding="utf-8")
                  assert f'href="../../{following.year}/W{following.week:02d}/"' in text
          print(f"PASS: {len(pages)} pages from {requested.first} through {requested.last}")
          PY

      - name: Record generated-output digest
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          from iso_week_range import IsoWeekRange

          requested = IsoWeekRange.parse(os.environ["FIRST_ISO_WEEK"], os.environ["LAST_ISO_WEEK"])
          paths = []
          for year in requested.by_year():
              paths += [Path(f"year-scaffolds/almanack-{year}.md"), Path(f"fixed-object-sky-notes-{year}.csv"),
                        Path(f"weekly-ephemeris-{year}.csv"), Path(f"sky-note-artwork-descriptors-{year}.json")]
              for directory in (Path(f"observing-descriptors-{year}"), Path(f"planet-finder-descriptors-{year}"),
                                Path(f"artwork-descriptors-{year}"), Path(f"site/{year}")):
                  paths += sorted(path for path in directory.rglob("*") if path.is_file())
          for year in range(requested.first.monday.year, requested.last.sunday.year + 1):
              paths.append(Path(f"calendar-events-{year}.json"))
          with Path("/tmp/almanack-before.sha256").open("w", encoding="utf-8") as output:
              for path in sorted(set(paths)):
                  output.write(f"{path} {hashlib.sha256(path.read_bytes()).hexdigest()}\n")
          PY

      - name: Verify complete build is idempotent
        run: |
          python build_almanack_range.py "$FIRST_ISO_WEEK" "$LAST_ISO_WEEK"
          python - <<'PY'
          import hashlib
          from pathlib import Path

          before = {}
          for line in Path("/tmp/almanack-before.sha256").read_text(encoding="utf-8").splitlines():
              path, digest = line.rsplit(" ", 1)
              before[path] = digest
          after = {path: hashlib.sha256(Path(path).read_bytes()).hexdigest() for path in before}
          assert before == after, "A complete second build changed generated output"
          print("PASS: complete build is idempotent")
          PY

      - name: Commit complete generated range
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python - <<'PY'
          import os
          import subprocess
          from iso_week_range import IsoWeekRange

          requested = IsoWeekRange.parse(os.environ["FIRST_ISO_WEEK"], os.environ["LAST_ISO_WEEK"])
          targets = ["year-scaffolds"]
          for year in requested.by_year():
              targets += [f"fixed-object-sky-notes-{year}.csv", f"weekly-ephemeris-{year}.csv",
                          f"sky-note-artwork-descriptors-{year}.json", f"observing-descriptors-{year}",
                          f"planet-finder-descriptors-{year}", f"artwork-descriptors-{year}", f"site/{year}"]
          for year in range(requested.first.monday.year, requested.last.sunday.year + 1):
              targets.append(f"calendar-events-{year}.json")
          subprocess.run(["git", "add", "--", *targets], check=True)
          PY
          if git diff --cached --quiet; then
            echo "Complete range is already current."
            exit 0
          fi
          git commit -m "Build complete Almanack $FIRST_ISO_WEEK through $LAST_ISO_WEEK"
          git pull --rebase origin main
          git push origin HEAD:main
