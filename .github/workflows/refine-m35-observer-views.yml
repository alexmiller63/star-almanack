name: Refine M35 Observer Views

"on":
  push:
    paths:
      - .github/workflows/refine-m35-observer-views.yml

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Star Almanack
        uses: actions/checkout@v4

      - name: Apply source renderer refinement
        run: python tools/refine_m35_observer_views.py

      - name: Commit renderer refinement and clean up helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/refine-m35-observer-views.yml tools/refine_m35_observer_views.py
          git add render_observer_views.py
          git commit -m "Improve M35 finder framing and target marking"
          git push
